name: Debug VM Logs

on:
  push:
    branches:
      - deploy-gcp-rubens
  workflow_dispatch:

jobs:
  debug:
    name: Run Diagnostics on VM
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ secrets.SSH_USERNAME || 'ubuntu' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

    steps:
      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run SSH Diagnostics
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST << 'EOF'
            echo "=== DOCKER CONTAINERS STATUS ==="
            sudo docker ps -a
            
            echo "=== TRAEFIK LOGS (LAST 100 LINES) ==="
            sudo docker logs --tail 100 tcc-traefik-proxy || true
            
            echo "=== DOCKER NETWORKS ==="
            sudo docker network ls
            
            echo "=== DOCKER-COMPOSE CONFIG VALIDATION ==="
            cd ~/TCC
            sudo docker-compose config
          EOF
