name: Deploy Student TCCs to GCP VM

on:
  push:
    branches:
      - deploy-gcp-rubens
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    env:
      SSH_USER: ${{ secrets.SSH_USERNAME || 'ubuntu' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Copiar arquivos de configuração essenciais para o Servidor via SCP (SSH)
      - name: Copy deployment configurations to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST "mkdir -p ~/TCC/ ~/.ssh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 docker-compose.yml init-multiple-databases.sh docker-compose.env $SSH_USER@$SSH_HOST:~/TCC/
          # Copiar a chave privada para que a VM possa clonar as dependências do GitHub
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST:~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST "chmod 600 ~/.ssh/id_ed25519 && ssh-keyscan -H github.com >> ~/.ssh/known_hosts"
          # Copiar docker-compose.env para .env para que o docker-compose o carregue automaticamente
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST "cp ~/TCC/docker-compose.env ~/TCC/.env"

      # SSH para o Servidor, atualizar código dos repositórios e rodar Docker Compose
      - name: Execute Deploy commands via SSH
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST "export GH_PAT='$GH_PAT'; bash -s" << 'EOF'
            set -e
            cd ~/TCC
            
            # Garantir permissão de execução para o inicializador do banco
            chmod +x init-multiple-databases.sh
            
            # Configuração/Atualização de cada Repositório do Aluno na pasta Home (/home/ubuntu/)
            declare -A repos=(
              ["repo-easy-english"]="deploy-gcp-rubens"
              ["repo-edu-hub"]="deploy-gcp-rubens"
              ["repo-rack-plus"]="deploy-gcp-rubens"
            )

            for repo in "${!repos[@]}"; do
              branch="${repos[$repo]}"
              target_dir="/home/ubuntu/$repo"
              if [ -d "$target_dir" ]; then
                echo "Updating existing repository $repo on branch $branch..."
                cd "$target_dir"
                git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/turma-ipi-rubens/$repo.git"
                git fetch origin
                git checkout -f "$branch"
                git reset --hard "origin/$branch"
                git pull origin "$branch"
                cd - > /dev/null
              else
                echo "Repository $repo not found. Cloning from GitHub..."
                git clone -b "$branch" "https://x-access-token:${GH_PAT}@github.com/turma-ipi-rubens/$repo.git" "$target_dir"
              fi
            done

            # Garantir que o usuário está no grupo docker para o futuro
            if ! groups $USER | grep -q "\bdocker\b"; then
              sudo usermod -aG docker $USER
            fi

            # Subir o ambiente Docker Compose atualizado usando sudo (garante permissão ao docker.sock)
            sudo docker-compose down
            sudo docker-compose up -d --build
            
            # Aguardar inicialização completa do Postgres e dos containers
            echo "Waiting 15 seconds for databases to initialize..."
            sleep 15

            echo "=== RUNNING POST-DEPLOY MIGRATIONS AND INITIALIZING DEFAULT USERS ==="

            # 1. Easy English (Django)
            echo "Running migrations for easy-english..."
            sudo docker-compose exec -T easy-english python manage.py makemigrations || true
            sudo docker-compose exec -T easy-english python manage.py migrate || true
            sudo docker-compose exec -T easy-english python -c "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin123')" || true

            # 2. Edu Hub (Django)
            echo "Running migrations for edu-hub..."
            sudo docker-compose exec -T edu-hub python manage.py makemigrations || true
            sudo docker-compose exec -T edu-hub python manage.py migrate || true
            sudo docker-compose exec -T edu-hub python -c "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin123')" || true

            # 3. Rack Plus (Django)
            echo "Running migrations for rack-plus..."
            sudo docker-compose exec -T rack-plus python manage.py makemigrations || true
            sudo docker-compose exec -T rack-plus python manage.py migrate || true
            sudo docker-compose exec -T rack-plus python -c "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin123')" || true

            echo "=== POST-DEPLOY SETUP COMPLETED ==="

            # Limpeza rápida de imagens antigas/inutilizadas
            sudo docker image prune -f
          EOF
