name: Deploy Student TCCs to GCP VM

on:
  push:
    branches:
      - deploy-gcp-rubens
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # Copiar arquivos de configuração essenciais para o Servidor via SCP (SSH)
      - name: Copy deployment configurations to server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p /home/${{ secrets.SSH_USERNAME }}/TCC/"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 docker-compose.yml init-multiple-databases.sh docker-compose.env ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USERNAME }}/TCC/

      # SSH para o Servidor, atualizar código dos repositórios e rodar Docker Compose
      - name: Execute Deploy commands via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd /home/${{ secrets.SSH_USERNAME }}/TCC
            
            # Garantir permissão de execução para o inicializador do banco
            chmod +x init-multiple-databases.sh
            
            # Configuração/Atualização de cada Repositório do Aluno
            declare -A repos=(
              ["repo-easy-english"]="deploy-gcp-rubens"
              ["repo-edu-hub"]="deploy-gcp-rubens"
              ["repo-enlace"]="deploy-gcp-rubens"
              ["repo-myserver"]="deploy-gcp-rubens"
              ["repo-rack-plus"]="deploy-gcp-rubens"
            )

            for repo in "${!repos[@]}"; do
              branch="${repos[$repo]}"
              if [ -d "$repo" ]; then
                echo "Updating existing repository $repo on branch $branch..."
                cd "$repo"
                git fetch origin
                git checkout "$branch"
                git pull origin "$branch"
                cd ..
              else
                echo "Repository $repo not found on VM. Please clone it manually or via automation first."
              fi
            done

            # Subir o ambiente Docker Compose atualizado
            docker-compose down
            docker-compose up -d --build
            
            # Limpeza rápida de imagens antigas/inutilizadas
            docker image prune -f
          EOF
